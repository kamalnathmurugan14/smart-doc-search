# Optional. Ollama is not needed for this project.
services:
  backend:
    image: python:3.11-slim
    working_dir: /app/backend
    volumes: [".:/app", "${DOCS_ROOT:-./backend/sample_docs}:/docs"]
    environment: { DOCS_ROOT: /docs, DATA_DIR: /app/data, CORS_ORIGINS: "http://localhost:5173" }
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  frontend:
    image: node:20
    working_dir: /app/frontend
    volumes: [".:/app"]
    command: sh -c "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
